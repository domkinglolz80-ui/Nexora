<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
  <title>Nexora</title>
  <style>
    :root { --orange: #ff7a18; --orange-2: #ffb347; --text: #fff4ec; --text-2: #d8c3b4; --muted: #9a8170; --line: rgba(255, 140, 60, 0.28); --grad: linear-gradient(135deg, #ffb347 0%, #ff7a18 45%, #ff4d1a 100%); color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at 20% 10%, rgba(255, 106, 0, 0.18), transparent 45%), radial-gradient(circle at 85% 90%, rgba(255, 77, 26, 0.14), transparent 40%), #0a0705;
      color: var(--text); font: 15px/1.5 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .card { width: min(440px, 100%); text-align: center; }
    .logo { width: 88px; height: 88px; margin: 0 auto 22px; display: grid; place-items: center; background: var(--grad); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); color: #1a0d04; font: 700 40px system-ui, sans-serif; filter: drop-shadow(0 0 22px rgba(255, 106, 0, 0.6)); }
    .loading .logo { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(0.88) rotate(30deg); filter: brightness(1.3); } }
    h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: 0.02em; }
    p { margin: 0 0 22px; color: var(--text-2); }
    .detail { margin-top: -12px; color: var(--muted); font-size: 12px; }
    form { display: grid; gap: 10px; text-align: left; }
    label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(38, 25, 16, 0.75); color: var(--text); font: inherit; outline: none; -webkit-user-select: text; user-select: text; }
    input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255, 122, 24, 0.25); }
    .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(38, 25, 16, 0.75); color: var(--text); font: 600 15px/1.2 'Segoe UI', system-ui, -apple-system, sans-serif; cursor: pointer; }
    button:hover { border-color: var(--orange); }
    button.primary { background: var(--grad); color: #1a0d04; border-color: transparent; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { min-height: 20px; margin: 0; color: #ff8a7a; font-size: 13px; }
    .hint { margin: 18px 0 0; color: var(--muted); font-size: 13px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">N</div>

    <section data-mode="loading">
      <h1 data-t="loadingTitle"></h1>
      <p data-t="loadingText"></p>
    </section>

    <section data-mode="offline">
      <h1 data-t="offlineTitle"></h1>
      <p data-t="offlineText"></p>
      <p class="detail" id="detail"></p>
      <div class="row">
        <button class="primary" id="retry" data-t="retry"></button>
        <button id="change" data-t="change"></button>
      </div>
    </section>

    <section data-mode="setup">
      <h1 data-t="setupTitle"></h1>
      <p data-t="setupText"></p>
      <form id="form">
        <label for="url" data-t="address"></label>
        <input id="url" placeholder="https://nexora-xxxx.onrender.com" autocomplete="url" spellcheck="false" />
        <p class="error" id="error" role="alert"></p>
        <button class="primary" type="submit" id="submit" data-t="connect"></button>
      </form>
      <p class="hint" data-t="setupHint"></p>
    </section>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const de = params.get('lang') !== 'en';
    const T = de ? {
      loadingTitle: 'Nexora startet…',
      loadingText: 'Der Server wird geweckt. Das dauert beim ersten Start manchmal bis zu einer Minute.',
      offlineTitle: 'Keine Verbindung',
      offlineText: 'Nexora ist gerade nicht erreichbar. Prüfe dein Internet oder versuche es gleich noch einmal.',
      retry: 'Erneut versuchen',
      change: 'Adresse ändern',
      setupTitle: 'Willkommen bei Nexora',
      setupText: 'Mit welchem Nexora-Server möchtest du dich verbinden?',
      address: 'Server-Adresse',
      connect: 'Verbinden',
      checking: 'Wird geprüft…',
      setupHint: 'Die Adresse findest du in Nexora im Browser unter dem Download-Symbol.',
    } : {
      loadingTitle: 'Starting Nexora…',
      loadingText: 'Waking up the server. On the first start this can take up to a minute.',
      offlineTitle: 'No connection',
      offlineText: 'Nexora cannot be reached right now. Check your internet or try again in a moment.',
      retry: 'Try again',
      change: 'Change address',
      setupTitle: 'Welcome to Nexora',
      setupText: 'Which Nexora server would you like to connect to?',
      address: 'Server address',
      connect: 'Connect',
      checking: 'Checking…',
      setupHint: 'You find the address in Nexora in your browser under the download icon.',
    };
    document.documentElement.lang = de ? 'de' : 'en';
    document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = T[el.dataset.t]));

    const mode = ['loading', 'offline', 'setup'].includes(params.get('mode')) ? params.get('mode') : 'setup';
    document.querySelectorAll('[data-mode]').forEach((el) => (el.hidden = el.dataset.mode !== mode));
    document.getElementById('card').classList.toggle('loading', mode === 'loading');
    document.getElementById('detail').textContent = params.get('detail') || '';

    const input = document.getElementById('url');
    input.value = params.get('server') || '';
    if (mode === 'setup') input.focus();

    document.getElementById('retry').onclick = () => window.nexoraSetup.retry();
    document.getElementById('change').onclick = () => window.nexoraSetup.change();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const submit = document.getElementById('submit');
      const error = document.getElementById('error');
      error.textContent = '';
      submit.disabled = true;
      submit.textContent = T.checking;
      const result = await window.nexoraSetup.connect(input.value);
      if (!result.ok) {
        error.textContent = result.error || '';
        submit.disabled = false;
        submit.textContent = T.connect;
      }
    };
  </script>
</body>
</html>
