# Builds the Nexora desktop app for Windows, macOS and Linux and publishes the
# installers as the GitHub release "desktop-v<version>". The web app links to
# releases/latest/download/<file>, so the file names must stay the same; the
# installed apps read releases/latest/download/latest*.yml to update themselves.
name: Desktop-App

on:
  push:
    branches: [nexora-app]
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      # Repository variable NEXORA_URL = address of the Nexora server, built into the app.
      - name: Server-Adresse einbauen
        if: ${{ vars.NEXORA_URL != '' }}
        shell: bash
        env:
          NEXORA_URL: ${{ vars.NEXORA_URL }}
        run: |
          node -e "require('fs').writeFileSync('server.json', JSON.stringify({ url: process.env.NEXORA_URL.trim() }))"

      - name: Installer bauen
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # latest.yml / latest-linux.yml tell the installed apps about the new version (self-update).
      - name: Update-Infos prüfen
        if: ${{ matrix.os != 'macos-latest' }}
        shell: bash
        run: |
          ls -la dist
          test -f dist/latest.yml || test -f dist/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: nexora-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/Nexora-Setup.exe
            desktop/dist/Nexora-Setup.exe.blockmap
            desktop/dist/Nexora.dmg
            desktop/dist/Nexora.AppImage
            desktop/dist/latest.yml
            desktop/dist/latest-linux.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="desktop-v$VERSION"
          ls -la out
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* \
              --target "$GITHUB_SHA" \
              --title "Nexora Desktop $VERSION" \
              --notes "Nexora als eigene App. Windows: Nexora-Setup.exe · macOS: Nexora.dmg · Linux: Nexora.AppImage" \
              --latest
          fi
