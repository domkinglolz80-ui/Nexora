<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0610" />
  <title>Nexora · Keine Verbindung</title>
  <!-- Shown by sw.js when Nexora is opened without internet. Everything is inline: nothing else is reachable then. -->
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at 50% 45%, rgba(255, 106, 0, 0.28), transparent 60%), #0a0705;
      color: #fff4ec; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    main { max-width: 340px; }
    img { width: 96px; height: 96px; animation: pulse 2.4s ease-in-out infinite; }
    h1 { margin: 18px 0 6px; font-size: 24px; }
    p { margin: 0 0 22px; color: #d8c3b4; }
    button {
      height: 46px; padding: 0 26px; border: 0; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, #ffb347, #ff7a18 45%, #ff4d1a); color: #1a0b02; font: 600 16px system-ui, sans-serif;
    }
    small { display: block; margin-top: 16px; color: #9a8170; }
    @keyframes pulse { 50% { transform: scale(0.92); opacity: 0.75; } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1 data-en="No connection">Keine Verbindung</h1>
    <p data-en="Nexora can't reach the internet right now. As soon as you're back online, it continues by itself.">Nexora erreicht gerade das Internet nicht. Sobald du wieder online bist, geht es von selbst weiter.</p>
    <button type="button" data-en="Try again">Erneut versuchen</button>
    <small data-en="Your messages and drafts are waiting for you.">Deine Nachrichten und Entwürfe warten auf dich.</small>
  </main>
  <script>
    // Same language choice as the app (stored by i18n.js).
    let lang = null;
    try { lang = JSON.parse(localStorage.getItem('nexora:lang')); } catch { /* storage not available */ }
    if (lang ? lang === 'en' : !/^de\b/i.test(navigator.language || '')) {
      document.documentElement.lang = 'en';
      document.title = 'Nexora · No connection';
      document.querySelectorAll('[data-en]').forEach((el) => (el.textContent = el.dataset.en));
    }
    const retry = () => location.reload();
    document.querySelector('button').onclick = retry;
    addEventListener('online', retry);
  </script>
</body>
</html>
